name: Generate Keystore & SHA-1

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore geotag-release.keystore \
            -alias geotag \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass geotag2024 \
            -keypass geotag2024 \
            -dname "CN=GeoTag, OU=Dev, O=GeoTag, L=Jakarta, ST=Jakarta, C=ID"
      
      - name: Extract SHA-1
        run: |
          keytool -list -v -keystore geotag-release.keystore -storepass geotag2024 | grep SHA1
          keytool -list -v -keystore geotag-release.keystore -storepass geotag2024 | grep SHA1 > sha1.txt
      
      - name: Upload keystore & SHA-1
        uses: actions/upload-artifact@v3
        with:
          name: keystore-and-sha1
          path: |
            geotag-release.keystore
            sha1.txt
